name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        id: build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew build --stacktrace --no-daemon 2>&1 | tee build.log

      # Every item has its definition, models, textures, name (and hooks their in-water texture).
      - name: Asset check
        if: steps.build.outcome == 'success'
        shell: bash
        run: python3 ci/check_assets.py && python3 ci/recipe_unlocks.py --check

      # Boot a dedicated server with the mod for a couple of minutes and keep its log: data-pack
      # format errors, registry problems and crashes show up here without launching the game.
      - name: Server smoke test
        id: smoke
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set +e
          mkdir -p run
          echo "eula=true" > run/eula.txt
          mkdir -p run/config && echo '{"server":{"general":{"logDataErrors":true}}}' > run/config/tide.json
          printf 'online-mode=false\nspawn-protection=0\nview-distance=4\nsimulation-distance=4\n' > run/server.properties
          ./gradlew runServer --no-daemon > server.log 2>&1 &
          pid=$!
          for i in $(seq 1 84); do
            sleep 5
            if grep -q "Done (" server.log; then sleep 30; break; fi
            if ! kill -0 $pid 2>/dev/null; then break; fi
          done
          pkill -f 'net.fabricmc' ; sleep 3; kill $pid 2>/dev/null
          grep -q "Done (" server.log && echo "started=yes" || echo "started=no"
          grep -E "TIDE-CI gear" server.log | sed 's/^.*TIDE-CI //' | tee gear.txt

      # Start the real client on a virtual screen, load into the test world (a small data pack builds
      # a fish tank in front of the player and fills the hotbar with Tide items) and take screenshots.
      - name: Client smoke test
        if: steps.build.outcome == 'success'
        timeout-minutes: 30
        shell: bash
        run: |
          set +e
          timeout 420 sudo apt-get update -q -o Acquire::Retries=3 > /dev/null 2>&1
          timeout 600 sudo apt-get install -y -q -o Acquire::Retries=3 xvfb imagemagick xdotool libgl1-mesa-dri libglx-mesa0 libegl-mesa0 mesa-utils mesa-vulkan-drivers 2>&1 | tail -3
          export LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe
          mkdir -p run/saves shots
          rm -rf run/saves/smoke && cp -r run/world run/saves/smoke
          mkdir -p run/saves/smoke/datapacks && cp -r ci/smokepack run/saves/smoke/datapacks/tide_smoke
          printf 'onboardAccessibility:false\nskipMultiplayerWarning:true\ntutorialStep:none\nrenderDistance:4\nsimulationDistance:5\nsoundCategory_master:0.0\npauseOnLostFocus:false\n' > run/options.txt
          Xvfb :99 -screen 0 1280x720x24 +extension GLX +render -nolisten tcp > xvfb.log 2>&1 &
          export DISPLAY=:99
          sleep 3; timeout 20 glxinfo -B 2>&1 | head -12 | tee glx.txt; cat xvfb.log | head -5
          echo "client step: tools ready $(date +%T)" | tee -a glx.txt
          ./gradlew runSmokeClient --no-daemon > client.log 2>&1 &
          pid=$!
          for i in $(seq 1 60); do
            sleep 5
            if grep -qiE "joined|logged in with entity|Started 'Integrated|Preparing spawn area: 100" client.log; then break; fi
            if ! kill -0 $pid 2>/dev/null; then break; fi
          done
          sleep 25; import -window root shots/1-world.png; for i in 1 2 3 4 5 6; do sleep 0.25; import -window root shots/1-world-$i.png; done
          # cast: hold right click to charge, then let go
          xdotool mousemove 640 360; xdotool mousedown 3; sleep 1.4; xdotool mouseup 3
          sleep 3; import -window root shots/2-cast.png
          # a real catch: wait for a bite (Lure V rod), click to start the minigame, click to set the hook
          for i in $(seq 1 90); do grep -q "TIDE-CI bite" client.log && break; sleep 0.5; done
          echo "bite: $(grep -c 'TIDE-CI bite' client.log)"
          sleep 0.3; xdotool click 3
          for i in $(seq 1 20); do grep -q "TIDE-CI minigame" client.log && break; sleep 0.25; done
          echo "minigame: $(grep -c 'TIDE-CI minigame' client.log)"
          sleep 0.6; import -window root shots/3-minigame.png
          xdotool click 3
          sleep 4; import -window root shots/3b-caught.png
          grep -n "TIDE-CI\|\[Tide catch\]" client.log | tail -5
          # then the journal
          sleep 1
          xdotool key 2; sleep 1; xdotool click 3
          sleep 4; import -window root shots/4-journal.png
          xdotool mousemove 340 140; sleep 0.5; xdotool click 1; sleep 2; import -window root shots/4b-angler.png
          xdotool key Escape; sleep 1
          # the tackle section, and the diamond rod's page (5th in the rods row)
          xdotool mousemove 430 140; sleep 0.5; xdotool click 1; sleep 2; import -window root shots/4c-tackle.png
          xdotool mousemove 520 212; sleep 0.5; xdotool click 1; sleep 2; import -window root shots/4d-tackle-item.png
          xdotool key Escape; sleep 1; xdotool key Escape; sleep 1
          xdotool key Escape; sleep 2; import -window root shots/5-after.png
          # inventory, hovering the graded bass in hotbar slot 3 (tooltip: quality, length, weight)
          xdotool key e; sleep 2; xdotool mousemove 568 494; sleep 1.5; import -window root shots/6-tooltip.png
          xdotool key Escape; sleep 1
          # tackle box (hotbar 8): open it, then sneak + right-click for the portable angling table
          xdotool key 8; sleep 1; xdotool click 3; sleep 2; import -window root shots/7-tackle-box.png
          xdotool key Escape; sleep 1
          xdotool keydown shift; sleep 0.3; xdotool click 3; sleep 0.5; xdotool keyup shift; sleep 2; import -window root shots/7b-portable-table.png
          # put the bamboo rod from the box's rack on the table: the rig card shows beside it
          xdotool mousemove 840 378; sleep 0.3; xdotool click 1; sleep 0.5; xdotool mousemove 531 231; sleep 0.3; xdotool click 1; sleep 1.5; import -window root shots/7b2-rig-card.png
          xdotool mousemove 531 231; sleep 0.3; xdotool click 1; sleep 0.5; xdotool mousemove 840 378; sleep 0.3; xdotool click 1; sleep 0.5
          xdotool key Escape; sleep 1
          # the fish satchel (hotbar 6), opened with sneak + right-click
          xdotool key 6; sleep 1; xdotool keydown shift; sleep 0.3; xdotool click 3; sleep 0.5; xdotool keyup shift; sleep 2; import -window root shots/7c-satchel.png
          xdotool key Escape; sleep 1; xdotool key t; sleep 1; xdotool type --delay 40 "/trigger tide_displays"; sleep 0.5; xdotool key Return; sleep 4; import -window root shots/8-displays.png; xdotool key t; sleep 1; xdotool type --delay 40 "/trigger tide_side"; sleep 0.5; xdotool key Return; sleep 3; import -window root shots/8b-displays-side.png
          # the Angling Table: Craft tab, the Hooks filter, a diamond hook made on a bone hook, then the Assemble tab
          xdotool key t; sleep 1; xdotool type --delay 40 "/trigger tide_bench"; sleep 0.5; xdotool key Return; sleep 2
          xdotool key 4; sleep 0.5; xdotool click 3; sleep 2; import -window root shots/9-bench.png
          read hx hy cx cy ax ay < <(grep "TIDE-CI bench px hooks" client.log | tail -1 | sed 's/.*hooks \([0-9]*\) \([0-9]*\) craft \([0-9]*\) \([0-9]*\) assemble \([0-9]*\) \([0-9]*\).*/\1 \2 \3 \4 \5 \6/')
          echo "bench at: hooks $hx,$hy craft $cx,$cy assemble $ax,$ay"
          if [ -n "$hx" ]; then
            xdotool mousemove $hx $hy; sleep 0.3; xdotool click 1; sleep 1; import -window root shots/9b-bench-hooks.png
            read dx dy < <(grep "TIDE-CI bench px diamond_hook" client.log | tail -1 | sed 's/.*diamond_hook \([0-9]*\) \([0-9]*\).*/\1 \2/')
            if [ -n "$dx" ]; then xdotool mousemove $dx $dy; sleep 0.3; xdotool click 1; sleep 1; import -window root shots/9c-bench-diamond.png; fi
            xdotool mousemove $cx $cy; sleep 0.3; xdotool click 1; sleep 1.5; import -window root shots/9d-bench-crafted.png
            xdotool mousemove $ax $ay; sleep 0.3; xdotool click 1; sleep 2; import -window root shots/9e-bench-assemble.png
          fi
          grep -h "TIDE-CI bench" client.log | tail -8 | tee bench.txt
          xdotool key Escape; sleep 1
          pkill -f 'net.fabricmc' ; sleep 3; kill $pid 2>/dev/null; true

      # Multiplayer: a dedicated server and the client joining it over the network (single player
      # skips network encoding, so some problems only show here). The player starts at level 2, so
      # the catch also levels them up (title, sound, broadcast).
      - name: Multiplayer smoke test
        if: steps.build.outcome == 'success'
        timeout-minutes: 12
        shell: bash
        run: |
          set +e
          export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe
          pgrep Xvfb > /dev/null || (Xvfb :99 -screen 0 1280x720x24 +extension GLX +render -nolisten tcp > /dev/null 2>&1 &)
          rm -rf run/world/datapacks/tide_smoke; mkdir -p run/world/datapacks
          cp -r ci/smokepack run/world/datapacks/tide_smoke
          # level 2 casts short: stand at the water's edge
          sed -i -e 's/^fishinglevel set @s .*/fishinglevel set @s 2/' -e 's/^tp @s ~ ~ ~ 0 35$/tp @s ~ ~ ~2 0 40/' run/world/datapacks/tide_smoke/data/tide_smoke/function/setup.mcfunction
          # a complicated rod: bonus honey, a line that cooks, a treble hook on a bone hook, the bell bobber, a lure
          sed -i 's|^item replace entity @s hotbar.0 with .*|item replace entity @s hotbar.0 with tide:honeycomb_fishing_rod[enchantments={"minecraft:lure":5},tide:fishing_line={id:"tide:redstone_line",count:1},tide:fishing_hook={id:"tide:treble_hook",count:1,components:{"tide:base_hook":"bone_hook"}},tide:fishing_bobber={id:"tide:bell_bobber",count:1},tide:fishing_lure={id:"tide:glow_lure",count:1}]|' run/world/datapacks/tide_smoke/data/tide_smoke/function/setup.mcfunction
          printf 'online-mode=false\nspawn-protection=0\nview-distance=4\nsimulation-distance=4\nenforce-secure-profile=false\nwhite-list=false\nenforce-whitelist=false\nenable-rcon=true\nrcon.password=ci\nrcon.port=25575\n' > run/server.properties
          ./gradlew runServer --no-daemon > server-mp.log 2>&1 &
          spid=$!
          for i in $(seq 1 84); do sleep 5; grep -q "Done (" server-mp.log && break; kill -0 $spid 2>/dev/null || break; done
          echo "server: $(grep -c 'Done (' server-mp.log)"
          timeout 60 python3 ci/rcon_guide.py 2>&1 | tee rcon.txt || true
          # popular client mods that hook into every entity (they found the hook accessor bug):
          # LambDynamicLights and whatever it requires, latest for this Minecraft version, from Modrinth
          mkdir -p run/mods
          mr() {  # project -> download its newest Fabric jar for this version, then its required dependencies
            local q='game_versions=%5B%2226.3%22%5D&loaders=%5B%22fabric%22%5D'
            local v; v=$(curl -sf "https://api.modrinth.com/v2/project/$1/version?$q" | jq -c '.[0] // empty')
            [ -z "$v" ] && { echo "modrinth: no $1 for 26.3"; return; }
            local url; url=$(echo "$v" | jq -r '(.files[] | select(.primary) | .url) // .files[0].url' | head -1)
            local file="run/mods/$(basename "$url")"
            [ -f "$file" ] && return
            curl -sfL "$url" -o "$file" && echo "modrinth: $1 -> $(basename "$url")"
            for dep in $(echo "$v" | jq -r '.dependencies[] | select(.dependency_type=="required") | .project_id'); do mr "$dep"; done
          }
          mr lambdynamiclights
          # Fresh Animations (a popular resource pack, through Entity Model Features) to check fish displays under it
          mr entity-model-features; mr entitytexturefeatures
          mkdir -p run/resourcepacks
          fa=$(curl -sf "https://api.modrinth.com/v2/project/fresh-animations/version" | jq -r '.[0] | ((.files[] | select(.primary) | .url) // .files[0].url)' | head -1)
          [ -n "$fa" ] && curl -sfL "$fa" -o run/resourcepacks/FreshAnimations.zip && echo "fresh animations: $(basename "$fa")"
          touch run/options.txt; sed -i '/^resourcePacks:/d' run/options.txt
          echo 'resourcePacks:["vanilla","fabric","file/FreshAnimations.zip"]' >> run/options.txt
          ls run/mods
          ./gradlew runSmokeMp --no-daemon > client-mp.log 2>&1 &
          cpid=$!
          for i in $(seq 1 60); do sleep 5; grep -q "joined the game" server-mp.log && break; kill -0 $cpid 2>/dev/null || break; done
          sleep 25; import -window root shots/m1-joined.png
          timeout 30 python3 ci/rcon_positions.py 2>&1 | tee -a rcon.txt || true
          xdotool mousemove 640 360; xdotool mousedown 3; sleep 1.4; xdotool mouseup 3
          for i in $(seq 1 90); do grep -q "TIDE-CI bite" server-mp.log && break; sleep 0.5; done
          echo "bite: $(grep -c 'TIDE-CI bite' server-mp.log)"
          sleep 0.3; xdotool click 3
          for i in $(seq 1 20); do grep -q "TIDE-CI minigame" client-mp.log && break; sleep 0.25; done
          echo "minigame: $(grep -c 'TIDE-CI minigame' client-mp.log)"
          sleep 0.6; import -window root shots/m2-minigame.png
          xdotool click 3
          sleep 2; import -window root shots/m3-caught.png
          sleep 6; import -window root shots/m4-after.png
          xdotool key t; sleep 1; xdotool type --delay 40 "/trigger tide_displays"; sleep 0.5; xdotool key Return; sleep 4; xdotool key F1; sleep 1; import -window root shots/m5-displays-fa.png; sleep 0.7; import -window root shots/m5b-displays-fa.png; xdotool key F1
          echo "--- server"; grep -nE "TIDE-CI|\[Tide catch\]|reached fishing|lost connection|left the game|Exception|ERROR" server-mp.log | tail -20
          echo "--- client"; grep -nE "TIDE-CI|Exception|ERROR|Disconnect|disconnect|lost" client-mp.log | grep -v "OpenGL\|GLX\|flite\|narrator\|OpenAL\|SoundSystem\|Realms\|sessionserver" | tail -20
          pkill -f 'net.fabricmc' ; sleep 3; kill $spid $cpid 2>/dev/null; rm -rf run/mods run/resourcepacks; sed -i '/^resourcePacks:/d' run/options.txt; true

      # The full build output is hard to read from outside GitHub, so the errors (and the tail
      # of the log) are also written to the ci-results branch: one file per run, plus latest.
      - name: Fresh Animations probe
        continue-on-error: true
        timeout-minutes: 3
        shell: bash
        run: |
          # what the Fresh Animations resource pack has for fish, so Tide's display compatibility matches it
          {
            v=$(curl -sf "https://api.modrinth.com/v2/project/fresh-animations/version" | jq -c '.[0]')
            echo "version: $(echo "$v" | jq -r '.version_number') for $(echo "$v" | jq -c '.game_versions[-3:]')"
            url=$(echo "$v" | jq -r '(.files[] | select(.primary) | .url) // .files[0].url' | head -1)
            curl -sfL "$url" -o fa.zip && mkdir -p fa && unzip -q -o fa.zip -d fa
            echo "--- fish files"; (cd fa && find . -iname '*fish*' -o -iname '*cod*' -o -iname '*salmon*' | sort)
            for f in $(cd fa && find . \( -iname 'tropical_fish*' \) -type f | sort); do echo "=== $f"; head -c 6000 "fa/$f"; echo; done
            for p in entity-model-features entitytexturefeatures; do
              echo "--- $p for 26.3: $(curl -sf "https://api.modrinth.com/v2/project/$p/version?game_versions=%5B%2226.3%22%5D&loaders=%5B%22fabric%22%5D" | jq -r '.[0].version_number // "none"')"
            done
          } > fa-probe.txt 2>&1 || true
          wc -c fa-probe.txt

      - name: Publish results to the ci-results branch
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          set +e +o pipefail
          touch build.log
          status="${{ steps.build.outcome }}"
          sha="${GITHUB_SHA::7}"
          mkdir -p /tmp/results
          {
            echo "commit: $GITHUB_SHA"
            echo "status: $status"
            echo "errors: $(grep -cE '^\S+\.java:[0-9]+: error:' build.log || true)"
            echo
            grep -E -A3 '^\S+\.java:[0-9]+: (error|warning):|^e: |FAILURE:|What went wrong|^\* What went wrong|Could not|Caused by' build.log | sed "s#$GITHUB_WORKSPACE/##" | head -6000
          } > /tmp/results/latest.txt
          tail -400 build.log | sed "s#$GITHUB_WORKSPACE/##" > /tmp/results/latest-tail.txt
          touch server.log
          {
            echo "server started: $(grep -c 'Done (' server.log)"
            grep -nE 'ERROR|WARN|Exception|Caused by|Failed|Couldn.t|Unknown|Missing' server.log | grep -v 'Using default\|Ambiguous' | head -3000
            echo; echo "---- tail ----"; tail -150 server.log
          } > /tmp/results/server.txt
          touch client.log
          {
            grep -nE 'ERROR|WARN|Exception|Caused by|Failed|Couldn.t|Unknown|Missing' client.log | head -3000
            echo; echo "---- tail ----"; tail -150 client.log
          } > /tmp/results/client.txt
          git config --global user.name "ci"
          git config --global user.email "ci@users.noreply.github.com"
          grep -E '^\S+\.java:[0-9]+: error:|What went wrong' -A1 build.log | sed "s#$GITHUB_WORKSPACE/##" | head -40 | while IFS= read -r l; do echo "::warning::$l"; done
          mkdir -p /tmp/ci && cd /tmp/ci && git init -q -b ci-results
          cp /tmp/results/latest.txt /tmp/results/latest-tail.txt /tmp/results/server.txt /tmp/results/client.txt . ; head -c 5000000 $GITHUB_WORKSPACE/client.log > client-full.log 2>/dev/null; mkdir -p shots; cp $GITHUB_WORKSPACE/shots/*.png shots/ 2>/dev/null; cp $GITHUB_WORKSPACE/glx.txt . 2>/dev/null; cp $GITHUB_WORKSPACE/gear.txt . 2>/dev/null; cp $GITHUB_WORKSPACE/rcon.txt . 2>/dev/null; cp $GITHUB_WORKSPACE/bench.txt . 2>/dev/null; cp $GITHUB_WORKSPACE/fa-probe.txt . 2>/dev/null; head -c 5000000 $GITHUB_WORKSPACE/server.log > server-full.log 2>/dev/null; head -c 5000000 $GITHUB_WORKSPACE/server-mp.log > server-mp.log 2>/dev/null; head -c 5000000 $GITHUB_WORKSPACE/client-mp.log > client-mp.log 2>/dev/null
          git add -A
          git commit -qm "build $sha: $status"
          tail -15 /tmp/ci/latest-tail.txt | while IFS= read -r l; do echo "::notice::$l"; done
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-results

      - name: Gear check
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          grep -q "TIDE-CI gear check done" server.log || { echo "the gear check didn't run"; exit 1; }
          if grep -q "TIDE-CI gear problem" server.log; then grep "TIDE-CI gear problem" server.log | sed 's/^.*problem: /::error::/'; exit 1; fi
          grep -E "TIDE-CI extras" server-mp.log | tail -3 || echo "(no multiplayer catch this run)"

      - name: Dev build download
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Latest dev build
          prerelease: true
          make_latest: false
          body: "Built from ${{ github.sha }}. For testing only: Minecraft 26.3, Fabric Loader 0.19.5+, Fabric API."
          files: build/libs/tide-plus-*[!s].jar

      # a new mod_version in gradle.properties publishes a real release (tag v<version>) with RELEASE_NOTES.md
      - name: Is this a new version?
        id: version
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "${{ github.repository }}" > /dev/null 2>&1; then echo "new=no" >> "$GITHUB_OUTPUT"; else echo "new=yes" >> "$GITHUB_OUTPUT"; fi

      - name: Release
        if: success() && steps.version.outputs.new == 'yes'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Tide+ ${{ steps.version.outputs.version }}
          prerelease: false
          make_latest: true
          body_path: RELEASE_NOTES.md
          files: build/libs/tide-plus-*[!s].jar

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tide-plus
          path: build/libs/*.jar
