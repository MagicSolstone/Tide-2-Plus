name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        id: build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew build --stacktrace --no-daemon 2>&1 | tee build.log

      # Boot a dedicated server with the mod for a couple of minutes and keep its log: data-pack
      # format errors, registry problems and crashes show up here without launching the game.
      - name: Server smoke test
        id: smoke
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set +e
          mkdir -p run
          echo "eula=true" > run/eula.txt
          mkdir -p run/config && echo '{"server":{"general":{"logDataErrors":true}}}' > run/config/tide.json
          printf 'online-mode=false\nspawn-protection=0\nview-distance=4\nsimulation-distance=4\n' > run/server.properties
          ./gradlew runServer --no-daemon > server.log 2>&1 &
          pid=$!
          for i in $(seq 1 84); do
            sleep 5
            if grep -q "Done (" server.log; then sleep 30; break; fi
            if ! kill -0 $pid 2>/dev/null; then break; fi
          done
          pkill -f 'net.fabricmc' ; sleep 3; kill $pid 2>/dev/null
          grep -q "Done (" server.log && echo "started=yes" || echo "started=no"

      # Start the real client on a virtual screen, load into the test world (a small data pack builds
      # a fish tank in front of the player and fills the hotbar with Tide items) and take screenshots.
      - name: Client smoke test
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set +e
          sudo apt-get update -q > /dev/null 2>&1
          sudo apt-get install -y -q xvfb imagemagick xdotool libgl1-mesa-dri libglx-mesa0 libegl-mesa0 mesa-utils mesa-vulkan-drivers 2>&1 | tail -3
          export LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe
          mkdir -p run/saves shots
          rm -rf run/saves/smoke && cp -r run/world run/saves/smoke
          mkdir -p run/saves/smoke/datapacks && cp -r ci/smokepack run/saves/smoke/datapacks/tide_smoke
          printf 'onboardAccessibility:false\nskipMultiplayerWarning:true\ntutorialStep:none\nrenderDistance:4\nsimulationDistance:5\nsoundCategory_master:0.0\npauseOnLostFocus:false\n' > run/options.txt
          Xvfb :99 -screen 0 1280x720x24 +extension GLX +render -nolisten tcp > xvfb.log 2>&1 &
          export DISPLAY=:99
          sleep 3; glxinfo -B 2>&1 | head -12 | tee glx.txt; cat xvfb.log | head -5
          ./gradlew runSmokeClient --no-daemon > client.log 2>&1 &
          pid=$!
          for i in $(seq 1 60); do
            sleep 5
            if grep -qiE "joined|logged in with entity|Started 'Integrated|Preparing spawn area: 100" client.log; then break; fi
            if ! kill -0 $pid 2>/dev/null; then break; fi
          done
          sleep 25; import -window root shots/1-world.png
          # cast: hold right click to charge, then let go
          xdotool mousemove 640 360; xdotool mousedown 3; sleep 1.4; xdotool mouseup 3
          sleep 3; import -window root shots/2-cast.png
          # a real catch: wait for a bite (Lure V rod), click to start the minigame, click to set the hook
          for i in $(seq 1 90); do grep -q "TIDE-CI bite" client.log && break; sleep 0.5; done
          echo "bite: $(grep -c 'TIDE-CI bite' client.log)"
          sleep 0.3; xdotool click 3
          for i in $(seq 1 20); do grep -q "TIDE-CI minigame" client.log && break; sleep 0.25; done
          echo "minigame: $(grep -c 'TIDE-CI minigame' client.log)"
          sleep 0.6; import -window root shots/3-minigame.png
          xdotool click 3
          sleep 4; import -window root shots/3b-caught.png
          grep -n "TIDE-CI\|\[Tide catch\]" client.log | tail -5
          # then the journal
          sleep 1
          xdotool key 2; sleep 1; xdotool click 3
          sleep 4; import -window root shots/4-journal.png
          xdotool mousemove 340 140; sleep 0.5; xdotool click 1; sleep 2; import -window root shots/4b-angler.png
          xdotool key Escape; sleep 1
          xdotool key Escape; sleep 2; import -window root shots/5-after.png
          # inventory, hovering the graded bass in hotbar slot 3 (tooltip: quality, length, weight)
          xdotool key e; sleep 2; xdotool mousemove 568 494; sleep 1.5; import -window root shots/6-tooltip.png
          xdotool key Escape; sleep 1
          pkill -f 'net.fabricmc' ; sleep 3; kill $pid 2>/dev/null; true

      # The full build output is hard to read from outside GitHub, so the errors (and the tail
      # of the log) are also written to the ci-results branch: one file per run, plus latest.
      - name: Publish results to the ci-results branch
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          set +e +o pipefail
          touch build.log
          status="${{ steps.build.outcome }}"
          sha="${GITHUB_SHA::7}"
          mkdir -p /tmp/results
          {
            echo "commit: $GITHUB_SHA"
            echo "status: $status"
            echo "errors: $(grep -cE '^\S+\.java:[0-9]+: error:' build.log || true)"
            echo
            grep -E -A3 '^\S+\.java:[0-9]+: (error|warning):|^e: |FAILURE:|What went wrong|^\* What went wrong|Could not|Caused by' build.log | sed "s#$GITHUB_WORKSPACE/##" | head -6000
          } > /tmp/results/latest.txt
          tail -400 build.log | sed "s#$GITHUB_WORKSPACE/##" > /tmp/results/latest-tail.txt
          touch server.log
          {
            echo "server started: $(grep -c 'Done (' server.log)"
            grep -nE 'ERROR|WARN|Exception|Caused by|Failed|Couldn.t|Unknown|Missing' server.log | grep -v 'Using default\|Ambiguous' | head -3000
            echo; echo "---- tail ----"; tail -150 server.log
          } > /tmp/results/server.txt
          touch client.log
          {
            grep -nE 'ERROR|WARN|Exception|Caused by|Failed|Couldn.t|Unknown|Missing' client.log | head -3000
            echo; echo "---- tail ----"; tail -150 client.log
          } > /tmp/results/client.txt
          git config --global user.name "ci"
          git config --global user.email "ci@users.noreply.github.com"
          grep -E '^\S+\.java:[0-9]+: error:|What went wrong' -A1 build.log | sed "s#$GITHUB_WORKSPACE/##" | head -40 | while IFS= read -r l; do echo "::warning::$l"; done
          mkdir -p /tmp/ci && cd /tmp/ci && git init -q -b ci-results
          cp /tmp/results/latest.txt /tmp/results/latest-tail.txt /tmp/results/server.txt /tmp/results/client.txt . ; head -c 5000000 $GITHUB_WORKSPACE/client.log > client-full.log 2>/dev/null; mkdir -p shots; cp $GITHUB_WORKSPACE/shots/*.png shots/ 2>/dev/null; cp $GITHUB_WORKSPACE/glx.txt . 2>/dev/null; head -c 5000000 $GITHUB_WORKSPACE/server.log > server-full.log 2>/dev/null
          git add -A
          git commit -qm "build $sha: $status"
          tail -15 /tmp/ci/latest-tail.txt | while IFS= read -r l; do echo "::notice::$l"; done
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-results

      - name: Dev build download
        if: success() && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Latest dev build
          prerelease: true
          make_latest: false
          body: "Built from ${{ github.sha }}. For testing only: Minecraft 26.3, Fabric Loader 0.19.5+, Fabric API."
          files: build/libs/tide-fabric-*[!s].jar

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tide-fabric
          path: build/libs/*.jar
