name: Minecraft sources (reference)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Decompile
        run: ./gradlew genSources --no-daemon || true
      - name: Push the sources jar to the mc-sources branch
        shell: bash
        run: |
          set +e
          find ~/.gradle .gradle -name '*sources*.jar' 2>/dev/null | xargs -r ls -la
          mkdir -p /tmp/s && cd /tmp/s && git init -q -b mc-sources
          i=0
          for f in $(find ~/.gradle .gradle -name 'minecraft*sources*.jar' 2>/dev/null); do
            i=$((i+1)); cp "$f" "mc-$i-$(basename $f)"
          done
          ls -la
          git config --global user.name ci; git config --global user.email ci@users.noreply.github.com
          git add -A && git commit -qm "26.3 sources" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" mc-sources
