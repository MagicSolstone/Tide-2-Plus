// Tide, Fabric only, for Minecraft 26.x (fork of Lightning-64/Tide-2, MPL-2.0).
plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group
base { archivesName = project.archives_base_name }

loom {
	accessWidenerPath = file("src/main/resources/tide.accesswidener")
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def props = [version: project.version, minecraft_version: project.minecraft_version, loader_version: project.loader_version]
	inputs.properties props
	filesMatching("fabric.mod.json") { expand props }
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
	// show every error, not just the first 100, so each CI run fixes as much as possible
	it.options.compilerArgs += ["-Xmaxerrs", "2000"]
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE.txt") { rename { "${it}_tide" } }
}

// CI helper: copy everything the code compiles against into build/cp (for working offline)
tasks.register('dumpClasspath', Copy) {
    from configurations.compileClasspath
    into layout.buildDirectory.dir('cp')
}

// CI helper: a client that loads straight into the smoke-test world (see .github/workflows/build.yml)
loom {
    runs {
        smokeClient {
            client()
            name = "Smoke Client"
            programArgs "--quickPlaySingleplayer", "smoke"
            vmArgs "-Dtide.ci=true"
        }
        // the same client joining a dedicated server on this machine (multiplayer smoke test)
        smokeMp {
            client()
            name = "Smoke Multiplayer Client"
            programArgs "--quickPlayMultiplayer", "localhost:25565"
            vmArgs "-Dtide.ci=true"
        }
        server {
            vmArgs "-Dtide.ci=true"
        }
    }
}

// the CI workflow runs its own virtual screen so it can take screenshots of it
tasks.matching { it.name == 'runSmokeClient' || it.name == 'runSmokeMp' }.configureEach { useXvfb = false }
